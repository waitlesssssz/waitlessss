<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WaitLess — ИИ-официант</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, sans-serif; overflow: hidden; }
    body {
      background-image: linear-gradient(rgba(255,255,255,0.86), rgba(255,255,255,0.86)), url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1600&q=80');
      background-size: cover;
      background-position: center;
    }
    .header {
      position: fixed; top: 0; left: 0; right: 0; text-align: center;
      padding: 48px 16px 0; color: #1a1a1a; font-size: 30px; font-weight: 800;
      letter-spacing: 0.3px; line-height: 1.3; z-index: 9998;
      opacity: 0; transform: translateY(-24px);
      animation: headerIn 0.9s ease-out 0.15s forwards;
    }
    @keyframes headerIn { to { opacity: 1; transform: translateY(0); } }
    .cta-wrap {
      position: fixed; top: 190px; left: 0; right: 0; display: flex;
      justify-content: center; z-index: 9998; opacity: 0;
      animation: headerIn 0.9s ease-out 0.4s forwards;
    }
    .cta-button {
      background: #1fb547; color: #fff; border: none; padding: 16px 32px;
      font-size: 17px; font-weight: 700; border-radius: 30px; cursor: pointer;
      box-shadow: 0 6px 18px rgba(31,181,71,0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .cta-button:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(31,181,71,0.45); }
    .loader {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      display: none; gap: 10px; z-index: 9997;
    }
    .loader.active { display: flex; }
    .loader span { width: 12px; height: 12px; border-radius: 50%; background: #1fb547; animation: dotPulse 1.1s ease-in-out infinite; }
    .loader span:nth-child(2) { animation-delay: 0.15s; }
    .loader span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes dotPulse { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>
  <div class="header">Здравствуйте, я — ваш<br>ИИ-официант</div>
  <div class="cta-wrap"><button class="cta-button" id="chat-with-waiter">Чат с ИИ-официантом</button></div>
  <div class="loader" id="loader"><span></span><span></span><span></span></div>
  <div bhAgentWidget="" bhAgentId="ec805aaf-c95a-40c1-b25e-5e6a2f359205" bhCustomerId="637910"></div>
  <script>
    var btn = document.getElementById('chat-with-waiter');
    var loaderEl = document.getElementById('loader');
    var chatOpen = false;
    var observerAttached = false;

    function findHost() { return document.querySelector('[bhagentwidget]'); }
    function findFab(shadow) {
      return shadow.querySelector('[aria-label="Открыть чат с AI-агентом"]') || shadow.querySelector('.bh-fab');
    }
    function resetHost(host) {
      host.style.position = '';
      host.style.inset = '';
      host.style.top = '';
      host.style.left = '';
      host.style.width = '';
      host.style.height = '';
      host.style.zIndex = '';
    }
    function hideFabIfPresent(host) {
      if (!host || !host.shadowRoot) return;
      var fab = findFab(host.shadowRoot);
      if (fab && fab.style.display !== 'none') {
        fab.style.display = 'none';
        if (chatOpen) {
          chatOpen = false;
          resetHost(host);
          btn.style.display = 'inline-block';
        }
      }
    }

    // MutationObserver реагирует мгновенно, как только чёрная кнопка появляется в shadow DOM —
    // это исключает любое её "мелькание" на экране.
    function attachObserver(host) {
      if (observerAttached || !host || !host.shadowRoot) return;
      observerAttached = true;
      hideFabIfPresent(host);
      var mo = new MutationObserver(function () { hideFabIfPresent(host); });
      mo.observe(host.shadowRoot, { childList: true, subtree: true, attributes: true });
    }

    // Пока shadowRoot ещё не создан виджетом — ждём его появления и параллельно
    // подстраховываемся коротким опросом.
    setInterval(function () {
      var host = findHost();
      if (host && host.shadowRoot) {
        attachObserver(host);
        hideFabIfPresent(host);
      }
    }, 100);

    btn.addEventListener('click', function () {
      btn.style.display = 'none';
      loaderEl.classList.add('active');
      var attempts = 0;
      var maxAttempts = 30;
      var tryOpen = setInterval(function () {
        attempts++;
        var host = findHost();
        if (host && host.shadowRoot) {
          attachObserver(host);
          var fab = findFab(host.shadowRoot);
          if (fab) {
            fab.click();
            loaderEl.classList.remove('active');
            chatOpen = true;
            setTimeout(function () {
              host.style.position = 'fixed';
              host.style.inset = '0';
              host.style.top = '0';
              host.style.left = '0';
              host.style.width = '100vw';
              host.style.height = '100vh';
              host.style.zIndex = '9999';
            }, 400);
            clearInterval(tryOpen);
            return;
          }
        }
        if (attempts >= maxAttempts) {
          clearInterval(tryOpen);
          loaderEl.classList.remove('active');
          btn.style.display = 'inline-block';
        }
      }, 300);
    });
  </script>
  <link rel="stylesheet" href="widget.css">
  <script src="widget.js" defer></script>
</body>
</html>
